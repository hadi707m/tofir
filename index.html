<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بقالتي — المنتجات والفواتير</title>
<style>
/* ===================== الثيمات ===================== */
body[data-theme="night"]{
  --bg:#0e1116; --surface:#161a22; --surface2:#1e232e; --border:#2a3140;
  --text:#e7ebf2; --muted:#8b94a7; --accent:#6c8cff; --accent-text:#0b0e14;
  --good:#35c68a; --bad:#ff6b6b; --warn:#ffb454; --shadow:0 12px 34px rgba(0,0,0,.45);
}
body[data-theme="coffee"]{
  --bg:#1a120e; --surface:#241a14; --surface2:#30231a; --border:#3f2e22;
  --text:#f2e5d7; --muted:#a8917c; --accent:#c98a4b; --accent-text:#1a120e;
  --good:#7bc47f; --bad:#e07a5f; --warn:#e8b26a; --shadow:0 12px 34px rgba(0,0,0,.5);
}
body[data-theme="morning"]{
  --bg:#f4f7fb; --surface:#ffffff; --surface2:#eef2f8; --border:#dde4ee;
  --text:#18202f; --muted:#6b7789; --accent:#2f6df6; --accent-text:#ffffff;
  --good:#1ea97c; --bad:#e04848; --warn:#d99000; --shadow:0 10px 30px rgba(30,50,90,.10);
}
body[data-theme="ocean"]{
  --bg:#061a22; --surface:#0c2733; --surface2:#123441; --border:#1c4655;
  --text:#ddf2fa; --muted:#7fa8b8; --accent:#23b5d3; --accent-text:#04161c;
  --good:#3ddc97; --bad:#ff7b7b; --warn:#ffc857; --shadow:0 12px 34px rgba(0,0,0,.45);
}
body[data-theme="forest"]{
  --bg:#0f150e; --surface:#161f15; --surface2:#1e2a1c; --border:#2b3a28;
  --text:#e6f0e2; --muted:#8ba183; --accent:#6fbf5e; --accent-text:#0b120a;
  --good:#6fbf5e; --bad:#e07a5f; --warn:#e8c547; --shadow:0 12px 34px rgba(0,0,0,.45);
}
body[data-theme="rose"]{
  --bg:#1a1116; --surface:#241720; --surface2:#301e2a; --border:#3f2836;
  --text:#f7e7f0; --muted:#b08b9f; --accent:#e56b9f; --accent-text:#1a1116;
  --good:#5fd0a0; --bad:#ff6b8a; --warn:#ffb454; --shadow:0 12px 34px rgba(0,0,0,.45);
}

/* ===================== أساسيات ===================== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",system-ui,-apple-system,sans-serif;
  transition:background .25s,color .25s;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ===================== الشريط العلوي ===================== */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px; gap:12px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.3px}
.brand .logo{font-size:22px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}

/* ===================== المحتوى ===================== */
main{
  max-width:1120px; margin:0 auto;
  padding:22px 92px 130px 24px;
  min-height:calc(100vh - 62px);
}
.page{display:none; animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-wrap:wrap; margin-bottom:18px;
}
.page-head h2{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.count{
  font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);
  padding:3px 10px;border-radius:20px;border:1px solid var(--border);
}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===================== أزرار ===================== */
.btn{
  border:1px solid var(--border); background:var(--surface2); color:var(--text);
  padding:9px 15px; border-radius:11px; cursor:pointer; font-size:14px; font-weight:600;
  transition:.18s; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px); border-color:var(--accent)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.icon-btn{
  border:1px solid transparent;background:transparent;color:var(--muted);
  width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:.18s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.danger:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.icon-btn.sm{width:26px;height:26px;font-size:12px}

.input,.field input,.field select,.field textarea{
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:10px 12px; border-radius:10px; font-size:14px; outline:none;
  transition:.18s; width:100%;
}
.input:focus,.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.input.search{width:200px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(0% + 14px) calc(50% - 2px),calc(0% + 19px) calc(50% - 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-left:32px}

/* ===================== الأرصفة الجانبية ===================== */
.dock{
  position:fixed; z-index:60; display:flex; gap:6px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid var(--border); padding:7px; border-radius:18px;
  box-shadow:var(--shadow); backdrop-filter:blur(14px);
}
.dock-right{right:16px; top:50%; transform:translateY(-50%); flex-direction:column}
.dock-left{left:16px; bottom:16px; flex-direction:column}
.dock-btn{
  width:46px;height:46px;border-radius:13px;border:1px solid transparent;
  background:transparent;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;transition:.2s; position:relative;
}
.dock-btn:hover{background:var(--surface2);color:var(--text);transform:scale(1.05)}
.dock-btn.active{background:var(--accent);color:var(--accent-text)}
.dock-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock-btn .badge{
  position:absolute; top:-3px; right:-3px;
  min-width:19px; height:19px; padding:0 5px;
  background:var(--bad); color:#fff; border-radius:20px;
  font-size:11px; font-weight:800; display:grid; place-items:center;
  border:2px solid var(--surface); font-variant-numeric:tabular-nums;
}
.dock-sep{height:1px;background:var(--border);margin:3px 6px}
body[data-mode="read"] .edit-only{display:none !important}

/* ===================== البطاقات ===================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:15px; transition:.2s;
}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));transform:translateY(-2px);box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-title{font-weight:700;font-size:16px;line-height:1.35}
.card-actions{display:flex;gap:2px}
.muted{color:var(--muted)}
.small{font-size:12px}

/* صورة المنتج في البطاقة */
.card-head-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.product-thumb{
  width:58px;height:58px;border-radius:13px;object-fit:cover;
  background:var(--surface2);border:1px solid var(--border);flex:none;
}
.product-thumb.placeholder{
  display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--muted);
}

.price-list{display:flex;flex-direction:column;gap:6px}
.price-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface2); border:1px solid transparent;
  padding:8px 11px; border-radius:10px; font-size:13.5px;
}
.price-row .store{color:var(--muted);font-weight:600}
.price-row .val{font-weight:800;font-variant-numeric:tabular-nums}
.price-row .val small{font-weight:500;color:var(--muted);font-size:10.5px}
.price-row.best{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 11%,var(--surface2))}
.price-row.best .val{color:var(--good)}
.price-row.na{opacity:.55}
.price-row.na .val{color:var(--bad);font-weight:700;font-size:12px}
.diff-badge{
  margin-top:11px;font-size:12px;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:6px 10px;border-radius:9px;text-align:center;
}
.diff-badge b{font-variant-numeric:tabular-nums}

/* ===================== الفواتير ===================== */
.invoice{
  background:var(--surface); border:1px solid var(--border);
  border-radius:15px; margin-bottom:11px; overflow:hidden; transition:.2s;
}
.invoice:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.invoice summary{
  list-style:none; cursor:pointer; padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.invoice summary::-webkit-details-marker{display:none}
.inv-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.inv-store{
  font-weight:700;background:var(--surface2);border:1px solid var(--border);
  padding:4px 11px;border-radius:20px;font-size:13px;
}
.inv-date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.inv-right{display:flex;align-items:center;gap:10px}
.inv-total{font-weight:800;font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.inv-total small{font-size:10px;color:var(--muted);font-weight:500}
.inv-items{border-top:1px solid var(--border);padding:10px 16px 14px;background:var(--surface2)}
.inv-item{
  display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px dashed var(--border);font-size:13.5px;
}
.inv-item:last-child{border-bottom:none}
.inv-item .nm{font-weight:600}
.inv-item .qt{color:var(--muted);font-size:12px;margin-inline-start:7px}
.inv-item .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===================== صفحة الشراء السريع ===================== */
.buy-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;
}
.buy-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px; display:flex; gap:11px; align-items:center; transition:.18s;
}
.buy-card.active{
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 9%,var(--surface));
}
.buy-img{
  width:52px;height:52px;border-radius:11px;object-fit:cover;
  background:var(--surface2);border:1px solid var(--border);flex:none;
}
.buy-img.placeholder{display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--muted)}
.buy-info{flex:1;min-width:0}
.buy-name{font-weight:700;font-size:14px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buy-qty{display:flex;gap:4px;margin-top:8px;align-items:center}
.qty-btn{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer;
  font-size:17px;font-weight:700;display:grid;place-items:center;transition:.15s;flex:none;
  line-height:1;
}
.qty-btn:hover{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}
.qty-input{
  flex:1;min-width:0;height:30px;text-align:center;background:var(--surface2);
  border:1px solid var(--border);border-radius:9px;color:var(--text);
  font-size:13.5px;font-weight:700;outline:none;font-variant-numeric:tabular-nums;
}
.qty-input:focus{border-color:var(--accent)}

.compare-row{
  display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
  padding:12px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;margin-bottom:8px;transition:.18s;
}
.compare-row:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.compare-row.best{
  border-color:var(--good);
  background:color-mix(in srgb,var(--good) 10%,var(--surface2));
}
.compare-store{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.compare-total{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.best-tag{
  font-size:10.5px;font-weight:800;background:var(--good);color:var(--accent-text);
  padding:2px 8px;border-radius:20px;
}
.warn-tag{
  font-size:10.5px;font-weight:700;
  background:color-mix(in srgb,var(--warn) 18%,transparent);
  color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 42%,transparent);
  padding:2px 8px;border-radius:20px;
}

/* ===================== التقارير ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:20px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;
}
.stat .lbl{color:var(--muted);font-size:12.5px;margin-bottom:7px;font-weight:600}
.stat .num{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat .num small{font-size:12px;color:var(--muted);font-weight:500}
.stat.accent .num{color:var(--accent)}
.stat.good .num{color:var(--good)}
.stat.bad .num{color:var(--bad)}

.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:18px;margin-bottom:16px;
}
.panel h3{margin:0 0 15px;font-size:16px;display:flex;align-items:center;gap:9px}
.panel h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

.bar-row{display:grid;grid-template-columns:130px 1fr 110px;gap:12px;align-items:center;margin-bottom:11px}
.bar-label{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:26px;background:var(--surface2);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,transparent));border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.3,1);min-width:3px}
.bar-fill.warn{background:linear-gradient(90deg,var(--warn),color-mix(in srgb,var(--warn) 55%,transparent))}
.bar-val{text-align:left;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.bar-val .sub{display:block;font-size:11px;font-weight:600}
.sub.good{color:var(--good)} .sub.bad{color:var(--bad)} .sub.muted{color:var(--muted)}

.hint{
  font-size:12.5px;color:var(--muted);background:var(--surface2);
  border:1px dashed var(--border);padding:10px 13px;border-radius:11px;line-height:1.7;
}
.hint b{color:var(--text)}

/* ===================== حالة فراغ ===================== */
.empty{
  text-align:center;padding:60px 20px;color:var(--muted);
  border:1.5px dashed var(--border);border-radius:18px;
}
.empty .big{font-size:44px;margin-bottom:12px;opacity:.6}
.empty p{margin:0 0 16px;font-size:14.5px}

/* ===================== النافذة المنبثقة ===================== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:18px;z-index:200;
}
.modal-backdrop.show{display:flex;animation:fade .18s ease}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;
}
.modal-head{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.modal-foot{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:9px;justify-content:flex-end;background:var(--surface2);
}

.field{display:flex;flex-direction:column;gap:7px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}

/* قائمة المحلات داخل نافذة المنتج */
.store-price-list{display:flex;flex-direction:column;gap:7px}
.store-price-item{
  display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;
  padding:8px 12px;background:var(--surface2);
  border:1px solid var(--border);border-radius:11px;transition:.18s;
}
.store-price-item.on{
  border-color:color-mix(in srgb,var(--good) 40%,transparent);
  background:color-mix(in srgb,var(--good) 8%,var(--surface2));
}
.sp-check-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:13.5px;user-select:none}
.sp-check-wrap input[type="checkbox"]{
  accent-color:var(--accent);width:18px;height:18px;cursor:pointer;flex:none;
}
.sp-price{
  padding:7px 10px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:13px;outline:none;width:100%;
  font-variant-numeric:tabular-nums;transition:.15s;
}
.sp-price:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.sp-price:disabled{opacity:.35;cursor:not-allowed}

.item-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.item-row{
  display:grid;grid-template-columns:1fr 78px 92px 78px 30px;
  gap:7px;align-items:center;
}
.item-row select,.item-row input{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 9px;border-radius:9px;font-size:13px;outline:none;width:100%;min-width:0;
}
.item-row select:focus,.item-row input:focus{border-color:var(--accent)}
.item-sub{
  font-size:13px;font-weight:700;text-align:center;color:var(--accent);
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;
}
.total-line{
  text-align:left;font-size:15px;padding:12px 16px;background:var(--surface2);
  border-radius:12px;border:1px solid var(--border);
}
.total-line b{color:var(--accent);font-size:19px;font-variant-numeric:tabular-nums}

/* رفع الصورة */
.img-upload{display:flex;gap:14px;align-items:center}
.img-preview{
  width:78px;height:78px;border-radius:14px;object-fit:cover;
  background:var(--surface2);border:1px solid var(--border);flex:none;
  display:grid;place-items:center;font-size:26px;color:var(--muted);
}
.img-actions{display:flex;gap:7px;flex-direction:column;flex:1}

/* مقارنة داخل نافذة الفاتورة */
.inv-compare-hint{
  font-size:12.5px;padding:10px 13px;border-radius:10px;line-height:1.65;
}
.inv-compare-hint.good{
  background:color-mix(in srgb,var(--good) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--good) 35%,transparent);
  color:var(--good);
}
.inv-compare-hint.muted{
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
}
.inv-compare-hint b{font-variant-numeric:tabular-nums}

/* ===================== إدارة المحلات ===================== */
.store-manage-list{display:flex;flex-direction:column;gap:8px}
.store-manage-item{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:10px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:11px;transition:.18s;
}
.store-manage-item:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.store-manage-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
.store-manage-count{
  font-size:11px;font-weight:700;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);
  padding:2px 8px;border-radius:20px;
}

/* ===================== لوحة المظهر ===================== */
.popover{
  position:absolute;top:calc(100% + 8px);left:0;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:15px;box-shadow:var(--shadow);display:none;width:270px;z-index:100;
}
.popover.show{display:block;animation:fade .18s ease}
.pop-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:15px}
.swatch{
  border:1px solid var(--border);background:var(--surface2);color:var(--text);
  padding:8px 9px;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.18s;
}
.swatch:hover{border-color:var(--accent)}
.swatch.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface2))}
.swatch i{width:13px;height:13px;border-radius:50%;display:block;flex:none}
.top-actions{position:relative;display:flex;gap:8px;align-items:center}

/* ===================== تنبيه ===================== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:11px 20px;border-radius:13px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);z-index:500;opacity:0;transition:.3s cubic-bezier(.2,.8,.3,1);
  display:flex;align-items:center;gap:9px;pointer-events:none;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.error{border-color:var(--bad);color:var(--bad)}

/* ===================== الجوال ===================== */
@media (max-width:720px){
  main{padding:16px 14px 150px}
  .dock-right{right:10px;top:auto;bottom:14px;transform:none;flex-direction:row}
  .dock-left{left:auto;right:10px;bottom:74px;flex-direction:row}
  .item-row{grid-template-columns:1fr 62px 76px;gap:6px}
  .item-row .item-sub{display:none}
  .item-row .icon-btn{grid-column:3}
  .field-row{grid-template-columns:1fr}
  .bar-row{grid-template-columns:88px 1fr 88px;gap:8px}
  .brand small{display:none}
  .input.search{width:100%}
  .head-actions{width:100%}
  .compare-row{grid-template-columns:1fr auto;gap:8px}
  .compare-row .btn{grid-column:1/-1}
  .store-price-item{grid-template-columns:1fr;gap:7px}
}
</style>
</head>

<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   أدوات مساعدة
============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthOf = d => String(d || '').slice(0, 7);
const monthLabel = m => {
  if (!m) return '';
  const [y, mo] = m.split('-');
  const names = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${names[+mo - 1]} ${y}`;
};
const firstChar = s => (String(s || '?').trim().charAt(0) || '?');

/* ============================================================
   ضغط الصور
============================================================ */
function resizeImage(file, maxSize = 220, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('not image'));
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
        else if (height >= width && height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   الحالة والتخزين
============================================================ */
const STORAGE_KEY = 'baqala_v1';

let state = {
  stores: [],            // ← المحلات الرئيسية (تُعرَّف مرة واحدة)
  products: [],
  invoices: [],
  theme: 'night',
  mode: 'edit',
  currency: 'ر.س',
  productSearch: '',
  invoiceMonth: monthOf(todayISO()),
  reportMonth: monthOf(todayISO()),
  buyCart: {}
};

let currentPage = 'products';
let editingProduct = null;
let editingInvoice = null;

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stores: state.stores,
      products: state.products,
      invoices: state.invoices,
      theme: state.theme,
      mode: state.mode,
      currency: state.currency,
      buyCart: state.buyCart
    }));
  } catch (e) {
    console.warn('تعذر الحفظ', e);
    toast('تعذّر الحفظ — قد تكون المساحة ممتلئة (صور كثيرة)', 'error');
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);

    state.products = Array.isArray(d.products) ? d.products : [];
    state.invoices = Array.isArray(d.invoices) ? d.invoices : [];
    state.theme = d.theme || 'night';
    state.mode = d.mode || 'edit';
    state.currency = d.currency || 'ر.س';
    state.buyCart = (d.buyCart && typeof d.buyCart === 'object') ? d.buyCart : {};

    if (Array.isArray(d.stores)) {
      state.stores = d.stores;
    } else {
      /* ترحيل تلقائي: استخرج المحلات من البيانات القديمة */
      const set = new Set();
      state.products.forEach(p => (p.prices || []).forEach(pr => {
        const s = (pr.store || '').trim();
        if (s) set.add(s);
      }));
      state.invoices.forEach(i => {
        const s = (i.store || '').trim();
        if (s) set.add(s);
      });
      state.stores = [...set].sort((a, b) => a.localeCompare(b, 'ar'));
    }
  } catch (e) { console.warn('تعذر التحميل', e); }
}

/* ============================================================
   المحلات — المصدر الوحيد
============================================================ */
function getStores() { return [...state.stores]; }

/* ينظّف اسم المحل من الفراغات ويحافظ على الترتيب */
function normalizeStore(s) { return String(s || '').trim().replace(/\s+/g, ' '); }

function addStore(name) {
  const s = normalizeStore(name);
  if (!s) return false;
  if (state.stores.some(x => x === s)) return false;
  state.stores.push(s);
  state.stores.sort((a, b) => a.localeCompare(b, 'ar'));
  persist();
  return true;
}

function removeStore(name) {
  state.stores = state.stores.filter(s => s !== name);
  /* احذف السعر من كل المنتجات */
  state.products.forEach(p => {
    if (Array.isArray(p.prices)) {
      p.prices = p.prices.filter(pr => normalizeStore(pr.store) !== name);
    }
  });
  persist();
}

function countProductsInStore(name) {
  return state.products.filter(p =>
    (p.prices || []).some(pr => normalizeStore(pr.store) === name)
  ).length;
}

/* ============================================================
   الأسعار
============================================================ */
function priceFor(product, store) {
  if (!product || !store) return null;
  const key = normalizeStore(store);
  const found = (product.prices || []).find(pr => normalizeStore(pr.store) === key);
  if (!found) return null;
  const n = Number(found.price);
  return isNaN(n) ? null : n;
}

const invoiceTotal = inv =>
  (inv.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);

const cartCount = () => Object.values(state.buyCart).filter(v => Number(v) > 0).length;

/* ============================================================
   التنبيهات
============================================================ */
let toastTimer;
function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast ' + type, 2400);
}

/* ============================================================
   المظهر
============================================================ */
const THEMES = [
  { id: 'night',   name: 'ليلي',   color: '#6c8cff' },
  { id: 'coffee',  name: 'قهوة',   color: '#c98a4b' },
  { id: 'morning', name: 'صباحي',  color: '#2f6df6' },
  { id: 'ocean',   name: 'محيط',   color: '#23b5d3' },
  { id: 'forest',  name: 'غابة',   color: '#6fbf5e' },
  { id: 'rose',    name: 'وردي',   color: '#e56b9f' }
];

function buildSwatches() {
  $('#swatches').innerHTML = THEMES.map(t => `
    <button class="swatch ${state.theme === t.id ? 'on' : ''}" data-act="theme" data-theme="${t.id}">
      <i style="background:${t.color}"></i>${t.name}
    </button>`).join('');
}

function setTheme(id) {
  state.theme = id;
  document.body.dataset.theme = id;
  buildSwatches();
  persist();
}

function toggleThemePanel() { $('#themePanel').classList.toggle('show'); }

/* ============================================================
   وضع القراءة / التحرير
============================================================ */
function toggleMode() {
  state.mode = state.mode === 'edit' ? 'read' : 'edit';
  document.body.dataset.mode = state.mode;
  $('#modeBtn').title = state.mode === 'edit' ? 'التبديل لوضع القراءة' : 'التبديل لوضع التحرير';
  toast(state.mode === 'edit' ? 'وضع التحرير مُفعّل' : 'وضع القراءة فقط');
  persist();
}

/* ============================================================
   التنقل
============================================================ */
function setPage(page) {
  currentPage = page;
  $$('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  $$('[data-act="nav"]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  renderCurrent();
}

function renderCurrent() {
  if (currentPage === 'products') renderProducts();
  else if (currentPage === 'buy') renderBuy();
  else if (currentPage === 'invoices') renderInvoices();
  else renderReports();
  updateBuyBadge();
}

function updateBuyBadge() {
  const n = cartCount();
  const b = $('#buyBadge');
  if (!b) return;
  b.style.display = n > 0 ? 'grid' : 'none';
  b.textContent = n;
}

/* ============================================================
   صفحة المنتجات
============================================================ */
function renderProducts() {
  const wrap = $('#page-products');
  const q = state.productSearch.trim().toLowerCase();
  const list = q ? state.products.filter(p => (p.name || '').toLowerCase().includes(q)) : state.products;
  const stores = getStores();

  let html = `
    <div class="page-head">
      <h2>المنتجات <span class="count">${state.products.length}</span></h2>
      <div class="head-actions">
        <input id="prodSearch" class="input search" placeholder="🔍 بحث عن منتج..." value="${esc(state.productSearch)}">
        <button class="btn ghost" data-act="manage-stores">🏪 المحلات <span class="count">${stores.length}</span></button>
        <button class="btn primary edit-only" data-act="add-product">+ منتج جديد</button>
      </div>
    </div>`;

  if (!stores.length) {
    html += `<div class="hint" style="margin-bottom:16px">
      💡 ابدأ بإضافة محلاتك الرئيسية من زر <b>🏪 المحلات</b>، ثم عند إضافة أي منتج ستظهر لك المحلات جاهزة مع خيار الشطب.
    </div>`;
  }

  if (!list.length) {
    html += `
      <div class="empty">
        <div class="big">📦</div>
        <p>${state.products.length ? 'لا نتائج مطابقة للبحث' : 'لا توجد منتجات بعد — أضف أول منتج وابدأ بتسجيل أسعاره في المحلات'}</p>
        ${!state.products.length ? `<button class="btn ghost edit-only" data-act="demo">تحميل بيانات تجريبية</button>` : ''}
      </div>`;
  } else {
    html += `<div class="grid">`;
    list.forEach(p => {
      /* اجمع الأسعار من المحلات المعرّفة فقط */
      const rows = stores.map(s => {
        const price = priceFor(p, s);
        return { store: s, price };
      });
      const nums = rows.filter(r => r.price != null).map(r => r.price);
      const min = nums.length ? Math.min(...nums) : null;
      const max = nums.length ? Math.max(...nums) : null;
      const diff = (min != null && max != null) ? max - min : 0;

      const thumb = p.image
        ? `<img class="product-thumb" src="${p.image}" alt="">`
        : `<div class="product-thumb placeholder">${esc(firstChar(p.name))}</div>`;

      html += `
        <div class="card">
          <div class="card-head-row">
            ${thumb}
            <div style="flex:1;min-width:0">
              <div class="card-top" style="margin:0">
                <div>
                  <div class="card-title">${esc(p.name)}</div>
                  ${p.unit ? `<div class="muted small">${esc(p.unit)}</div>` : ''}
                </div>
                <div class="card-actions edit-only">
                  <button class="icon-btn" data-act="edit-product" data-id="${p.id}" title="تعديل">✎</button>
                  <button class="icon-btn danger" data-act="del-product" data-id="${p.id}" title="حذف">🗑</button>
                </div>
              </div>
            </div>
          </div>
          <div class="price-list">
            ${rows.map(r => {
              if (r.price == null) {
                return `<div class="price-row na">
                  <span class="store">${esc(r.store)}</span>
                  <span class="val">غير متوفر</span>
                </div>`;
              }
              const isBest = nums.length > 1 && r.price === min;
              return `<div class="price-row ${isBest ? 'best' : ''}">
                <span class="store">${esc(r.store)}</span>
                <span class="val">${fmt(r.price)} <small>${esc(state.currency)}</small></span>
              </div>`;
            }).join('')}
          </div>
          ${diff > 0 ? `<div class="diff-badge">الفرق بين أغلى وأرخص محل: <b>${fmt(diff)}</b> ${esc(state.currency)}</div>` : ''}
        </div>`;
    });
    html += `</div>`;
  }

  wrap.innerHTML = html;
}

/* ============================================================
   صفحة الشراء السريع
============================================================ */
function renderBuy() {
  const wrap = $('#page-buy');
  const stores = getStores();
  const cartItems = state.products
    .map(p => ({ product: p, qty: Number(state.buyCart[p.id]) || 0 }))
    .filter(x => x.qty > 0);

  let html = `
    <div class="page-head">
      <h2>🛒 شراء سريع <span class="count">${cartItems.length}</span></h2>
      <div class="head-actions">
        ${cartItems.length ? `<button class="btn ghost" data-act="clear-buy-cart">تفريغ السلة</button>` : ''}
      </div>
    </div>
    <div class="hint" style="margin-bottom:16px">
      ✨ حدّد الكميات بالضغط على <b>+ / −</b>، ثم اختر المحل الذي تريد الشراء منه من القائمة أسفل.
      سيتم إنشاء فاتورة تلقائياً بأسعار ذلك المحل.
    </div>`;

  if (!state.products.length) {
    html += `<div class="empty"><div class="big">📦</div><p>لا توجد منتجات — أضف منتجات أولاً من صفحة المنتجات</p></div>`;
    wrap.innerHTML = html;
    return;
  }

  html += `<div class="buy-grid">`;
  state.products.forEach(p => {
    const qty = Number(state.buyCart[p.id]) || 0;
    const img = p.image
      ? `<img class="buy-img" src="${p.image}" alt="">`
      : `<div class="buy-img placeholder">${esc(firstChar(p.name))}</div>`;

    /* أرخص محل متوفر فيه المنتج */
    let cheapest = null;
    stores.forEach(s => {
      const pr = priceFor(p, s);
      if (pr != null && (!cheapest || pr < cheapest.price)) cheapest = { store: s, price: pr };
    });

    html += `
      <div class="buy-card ${qty > 0 ? 'active' : ''}">
        ${img}
        <div class="buy-info">
          <div class="buy-name">${esc(p.name)}</div>
          <div class="muted small">
            ${cheapest ? `أرخص: ${fmt(cheapest.price)} · ${esc(cheapest.store)}` : 'لا أسعار مسجلة'}
          </div>
          <div class="buy-qty">
            <button class="qty-btn" data-act="buy-qty" data-id="${p.id}" data-delta="-1">−</button>
            <input type="number" min="0" step="1" value="${qty || ''}" placeholder="0"
              class="qty-input" data-act="buy-qty-input" data-id="${p.id}">
            <button class="qty-btn" data-act="buy-qty" data-id="${p.id}" data-delta="1">+</button>
          </div>
        </div>
      </div>`;
  });
  html += `</div>`;

  html += `<div id="buyComparePanel">${buildBuyComparisonHTML(cartItems, stores)}</div>`;

  wrap.innerHTML = html;
}

function buildBuyComparisonHTML(cartItems, stores) {
  if (!cartItems.length) {
    return `<div class="hint" style="margin-top:20px">🧺 السلة فارغة — اختر منتجات لتظهر المقارنة بين المحلات</div>`;
  }
  if (!stores.length) {
    return `<div class="hint" style="margin-top:20px">لا توجد محلات معرّفة — أضف محلاتك من صفحة المنتجات</div>`;
  }

  const comparisons = stores.map(s => {
    let total = 0, missing = [], covered = 0;
    cartItems.forEach(({ product, qty }) => {
      const pr = priceFor(product, s);
      if (pr != null) { total += pr * qty; covered++; }
      else missing.push(product.name);
    });
    return { store: s, total, missing, covered };
  });

  const fullCoverage = comparisons.filter(c => c.missing.length === 0);
  const minTotal = fullCoverage.length ? Math.min(...fullCoverage.map(c => c.total)) : null;

  comparisons.sort((a, b) => {
    if (a.missing.length !== b.missing.length) return a.missing.length - b.missing.length;
    return a.total - b.total;
  });

  let html = `<div class="panel" style="margin-top:20px">
    <h3><span class="dot"></span>كم تكلّف السلة في كل محل؟</h3>`;

  comparisons.forEach(c => {
    const isBest = c.missing.length === 0 && c.total === minTotal;
    const canBuy = c.missing.length === 0;
    html += `
      <div class="compare-row ${isBest ? 'best' : ''}">
        <div class="compare-store">
          🏪 ${esc(c.store)}
          ${isBest ? `<span class="best-tag">الأرخص</span>` : ''}
          ${c.missing.length ? `<span class="warn-tag">ناقص ${c.missing.length} صنف</span>` : ''}
        </div>
        <div class="compare-total">${canBuy || c.total > 0 ? fmt(c.total) : '—'} ${esc(state.currency)}</div>
        <button class="btn ${isBest ? 'primary' : ''} small" data-act="buy-now"
          data-store="${esc(c.store)}" ${canBuy ? '' : 'disabled'}>
          ${canBuy ? 'شراء من هنا' : 'غير متاح'}
        </button>
      </div>`;
  });

  const totalPieces = cartItems.reduce((s, x) => s + x.qty, 0);
  html += `<div class="hint" style="margin-top:12px">
    🧾 إجمالي القطع: <b>${fmt(totalPieces)}</b> — عدد الأصناف: <b>${cartItems.length}</b>.
    الأصناف غير المتوفرة في محلٍ ما تُستثنى من حسابه، لذا يظهر زر الشراء معطلاً إذا لم يغطِّ المحل كل السلة.
  </div>`;

  html += `</div>`;
  return html;
}

function updateBuyComparisonPanel() {
  const panel = $('#buyComparePanel');
  if (!panel) return;
  const stores = getStores();
  const cartItems = state.products
    .map(p => ({ product: p, qty: Number(state.buyCart[p.id]) || 0 }))
    .filter(x => x.qty > 0);
  panel.innerHTML = buildBuyComparisonHTML(cartItems, stores);
}

function buyNow(store) {
  const items = [];
  state.products.forEach(p => {
    const qty = Number(state.buyCart[p.id]) || 0;
    if (qty <= 0) return;
    const price = priceFor(p, store);
    if (price == null) return;
    items.push({
      productId: p.id,
      name: p.name,
      unit: p.unit || '',
      qty,
      price
    });
  });
  if (!items.length) return toast('لا أصناف قابلة للشراء من هذا المحل', 'error');

  const inv = { id: uid(), date: todayISO(), store, items };
  state.invoices.push(inv);
  state.buyCart = {};
  persist();
  renderBuy();
  updateBuyBadge();
  toast(`تم تسجيل فاتورة من "${store}" ✅`);
}

============================================================ */
function renderReports() {
  const wrap = $('#page-reports');
  const month = state.reportMonth;
  const invs = state.invoices.filter(i => monthOf(i.date) === month);
  const actual = invs.reduce((s, i) => s + invoiceTotal(i), 0);

  const byStore = {};
  invs.forEach(i => {
    const k = i.store || 'بدون محل';
    byStore[k] = (byStore[k] || 0) + invoiceTotal(i);
  });

  const stores = getStores();
  const whatIf = stores.map(s => ({ store: s, total: 0, covered: 0, missing: 0 }));
  invs.forEach(inv => (inv.items || []).forEach(it => {
    const p = state.products.find(x => x.id === it.productId);
    whatIf.forEach(w => {
      const pr = p ? priceFor(p, w.store) : null;
      if (pr != null) { w.total += pr * (Number(it.qty) || 0); w.covered++; }
      else w.missing++;
    });
  }));

  const maxStore = Math.max(1, ...Object.values(byStore));
  const fullCoverage = whatIf.filter(w => w.missing === 0 && w.covered > 0);
  const best = fullCoverage.length ? fullCoverage.reduce((a, b) => a.total <= b.total ? a : b) : null;
  const worst = fullCoverage.length ? fullCoverage.reduce((a, b) => a.total >= b.total ? a : b) : null;
  const potentialSave = best ? actual - best.total : 0;

  let html = `
    <div class="page-head">
      <h2>التقارير الشهرية</h2>
      <div class="head-actions">
        <input type="month" id="repMonth" class="input" style="width:170px" value="${esc(month)}">
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat accent"><div class="lbl">إجمالي المصروف — ${esc(monthLabel(month))}</div>
        <div class="num">${fmt(actual)} <small>${esc(state.currency)}</small></div></div>
      <div class="stat"><div class="lbl">عدد الفواتير</div><div class="num">${invs.length}</div></div>
      <div class="stat good"><div class="lbl">أرخص محل للسلة</div>
        <div class="num" style="font-size:17px">${best ? esc(best.store) : '—'}</div></div>
      <div class="stat ${potentialSave > 0.01 ? 'bad' : 'good'}">
        <div class="lbl">الفرق لو اشتريت من الأرخص</div>
        <div class="num">${potentialSave > 0.01 ? '−' : ''}${fmt(Math.abs(potentialSave))} <small>${esc(state.currency)}</small></div>
      </div>
    </div>`;

  html += `<div class="panel"><h3><span class="dot"></span>المصروف الفعلي حسب المحل</h3>`;
  const storeKeys = Object.keys(byStore).sort((a, b) => byStore[b] - byStore[a]);
  if (!storeKeys.length) {
    html += `<div class="muted small">لا بيانات لهذا الشهر</div>`;
  } else {
    storeKeys.forEach(k => {
      const v = byStore[k];
      const pct = (v / maxStore) * 100;
      const share = actual > 0 ? ((v / actual) * 100).toFixed(1) : 0;
      html += `
        <div class="bar-row">
          <span class="bar-label">🏪 ${esc(k)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="bar-val">${fmt(v)}<span class="sub muted">${share}% من الإجمالي</span></span>
        </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="panel"><h3><span class="dot"></span>ماذا لو اشتريت نفس السلة من محل واحد؟</h3>`;
  if (!whatIf.length || !invs.length) {
    html += `<div class="muted small">تحتاج إلى فواتير + أسعار منتجات في المحلات لعرض المقارنة</div>`;
  } else {
    const maxTotal = Math.max(1, ...whatIf.map(w => w.total));
    const sorted = [...whatIf].sort((a, b) => {
      if (a.missing !== b.missing) return a.missing - b.missing;
      return a.total - b.total;
    });
    sorted.forEach(w => {
      const pct = (w.total / maxTotal) * 100;
      const d = actual - w.total;
      const isFull = w.missing === 0;
      let sub;
      if (!isFull) sub = `<span class="sub muted">⚠ ناقص ${w.missing} صنف</span>`;
      else if (d > 0.01) sub = `<span class="sub good">توفير ${fmt(d)}</span>`;
      else if (d < -0.01) sub = `<span class="sub bad">أغلى ${fmt(-d)}</span>`;
      else sub = `<span class="sub muted">نفس التكلفة</span>`;

      html += `
        <div class="bar-row">
          <span class="bar-label">🏪 ${esc(w.store)}</span>
          <div class="bar-track"><div class="bar-fill ${isFull ? '' : 'warn'}" style="width:${pct}%"></div></div>
          <span class="bar-val">${fmt(w.total)}${sub}</span>
        </div>`;
    });

    html += `<div class="hint" style="margin-top:14px">
      📌 <b>كيف تُحسب؟</b> نأخذ كل الأصناف التي اشتريتها هذا الشهر (الكميات) ونعيد تسعيرها بأسعار كل محل من صفحة المنتجات.
      ${best ? `أرخص محل للسلة كاملة هو <b>${esc(best.store)}</b> بتكلفة <b>${fmt(best.total)} ${esc(state.currency)}</b>.` : ''}
      ${worst && best && worst.store !== best.store ? ` وأغلاها <b>${esc(worst.store)}</b> بفرق <b>${fmt(worst.total - best.total)} ${esc(state.currency)}</b>.` : ''}
      <br>⚠️ الأصناف غير المتوفرة في محل معيّن تُستثنى من حسابه (تظهر بعلامة "ناقص").
    </div>`;
  }
  html += `</div>`;

  wrap.innerHTML = html;
}

function renderStorePriceList() {
  const wrap = $('#storePriceList');

  if (!stores.length) {
    wrap.innerHTML = `<div class="hint">لا توجد محلات معرّفة. أغلق هذه النافذة واذهب إلى <b>🏪 المحلات</b> لإضافتها.</div>`;
    return;
  }

  /* خريطة سريعة للأسعار الموجودة */
  const priceMap = {};
  (editingProduct.prices || []).forEach(pr => {
    const key = normalizeStore(pr.store);
    if (key) priceMap[key] = pr.price;
  });

  wrap.innerHTML = stores.map(s => {
    const has = Object.prototype.hasOwnProperty.call(priceMap, s);
    const val = has ? priceMap[s] : '';
    return `
      <div class="store-price-item ${has ? 'on' : ''}" data-store="${esc(s)}">
        <label class="sp-check-wrap">
          <input type="checkbox" class="sp-check" ${has ? 'checked' : ''}>
          <span class="sp-name">${esc(s)}</span>
        </label>
        <input type="number" class="sp-price" min="0" step="0.01"
          value="${esc(val)}" placeholder="السعر" ${has ? '' : 'disabled'}>
      </div>`;
  }).join('');
}

function refreshProductImagePreview() {
  const wrap = $('#imgPreviewWrap');
  if (!wrap || !editingProduct) return;
  wrap.innerHTML = editingProduct.image
    ? `<img class="img-preview" src="${editingProduct.image}" alt="">`
    : `<div class="img-preview">🖼</div>`;
}

function saveProduct() {
  const p = editingProduct;
  if (!p) return;
  if (!p.name.trim()) return toast('اكتب اسم المنتج', 'error');

  /* اجمع الأسعار من قائمة المحلات المشطوبة/المحددة */
  const wrap = $('#storePriceList');
  const newPrices = [];
  if (wrap) {
    $$('.store-price-item', wrap).forEach(row => {
      const store = row.dataset.store;
      const chk = $('.sp-check', row);
      const priceIn = $('.sp-price', row);
      if (!chk || !chk.checked) return;
      const v = Number(priceIn?.value);
      if (priceIn && priceIn.value !== '' && !isNaN(v) && v >= 0) {
        newPrices.push({ store, price: v });
      }
    });
  }

  p.name = p.name.trim();
  p.unit = (p.unit || '').trim();
  p.prices = newPrices;

  const i = state.products.findIndex(x => x.id === p.id);
  if (i >= 0) state.products[i] = p; else state.products.push(p);

  persist();
  closeModal();
  renderCurrent();
  toast('تم حفظ المنتج ✅');
}

function deleteProduct(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`حذف المنتج "${p.name}" ؟\n(الفواتير القديمة لن تتأثر)`)) return;
  state.products = state.products.filter(x => x.id !== id);
  delete state.buyCart[id];
  persist();
  closeModal();
  renderCurrent();
  toast('تم حذف المنتج');
}

  wrap.innerHTML = inv.items.map((it, i) => {

      </select>
      <input class="item-qty" type="number" min="0" step="0.01" value="${esc(it.qty)}" placeholder="كمية">
      <input class="item-price" type="number" min="0" step="0.01" value="${esc(it.price)}" placeholder="سعر">
      <span class="item-sub">${fmt(sub)}</span>
      <button class="icon-btn danger sm" data-act="del-item" data-idx="${i}">✕</button>
    </div>`;
  }).join('');
}

function updateSubtotals() {
  const wrap = $('#itemRows');
  if (!wrap || !editingInvoice) return;
  $$('.item-row', wrap).forEach(row => {
    const it = editingInvoice.items[+row.dataset.idx];
    if (!it) return;
    const sub = (Number(it.qty) || 0) * (Number(it.price) || 0);
    const el = $('.item-sub', row);
    if (el) el.textContent = fmt(sub);
  });
  updateInvTotal();
  renderInvoiceComparison();
}

function updateInvTotal() {
  const el = $('#invTotal');
  if (el && editingInvoice) el.textContent = fmt(invoiceTotal(editingInvoice));
}

function renderInvoiceComparison() {
  const el = $('#invCompare');
  if (!el || !editingInvoice) return;

  const items = (editingInvoice.items || []).filter(it => it.productId && Number(it.qty) > 0);
  if (!items.length) { el.innerHTML = ''; return; }

  const stores = getStores();
  if (!stores.length) { el.innerHTML = ''; return; }

  const currentStore = normalizeStore(editingInvoice.store);
  const currentTotal = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);

  const comp = stores.map(s => {
    let total = 0, missing = 0, covered = 0;
    items.forEach(it => {
      const p = state.products.find(x => x.id === it.productId);
      const pr = priceFor(p, s);
      if (pr != null) { total += pr * Number(it.qty); covered++; }
      else missing++;
    });
    return { store: s, total, missing, covered };
  });

  const alternatives = comp.filter(c => c.missing === 0 && c.store !== currentStore);
  const bestAlt = alternatives.length
    ? alternatives.reduce((a, b) => a.total <= b.total ? a : b)
    : null;

  if (!bestAlt) { el.innerHTML = ''; return; }

  const diff = currentTotal - bestAlt.total;

  if (Math.abs(diff) < 0.01) {
    el.innerHTML = `<div class="inv-compare-hint muted">⚖️ نفس التكلفة تقريباً في <b>${esc(bestAlt.store)}</b> (${fmt(bestAlt.total)} ${esc(state.currency)})</div>`;
  } else if (diff > 0) {
    el.innerHTML = `<div class="inv-compare-hint good">
      💡 لو شريت نفس الأصناف من <b>${esc(bestAlt.store)}</b> بدلاً من "${esc(currentStore || 'بدون محل')}"،
      التكلفة تكون <b>${fmt(bestAlt.total)} ${esc(state.currency)}</b> — توفير <b>${fmt(diff)} ${esc(state.currency)}</b>.
    </div>`;
  } else {
    el.innerHTML = `<div class="inv-compare-hint muted">
      ✅ "${esc(currentStore)}" خيار جيد — أرخص بديل (<b>${esc(bestAlt.store)}</b>) بسعر
      <b>${fmt(bestAlt.total)} ${esc(state.currency)}</b> أغلى بـ <b>${fmt(-diff)} ${esc(state.currency)}</b>.
    </div>`;
  }
}

function fillPricesFromStore() {
  if (!editingInvoice) return;
  const store = editingInvoice.store;
  editingInvoice.items.forEach(it => {
    if (!it.productId) return;
    const p = state.products.find(x => x.id === it.productId);
    const pr = priceFor(p, store);
    if (pr != null) it.price = pr;
  });
}

function saveInvoice() {
  const inv = editingInvoice;
  if (!inv) return;
  if (!inv.store || !inv.store.trim()) return toast('اختر المحل', 'error');

  const items = (inv.items || []).filter(it =>
    it.productId && (Number(it.qty) || 0) > 0 && it.price !== '' && !isNaN(Number(it.price))
  );

  if (!items.length) return toast('أضف صنفاً واحداً على الأقل', 'error');

  inv.store = normalizeStore(inv.store);
  inv.items = items.map(it => {
    const p = state.products.find(x => x.id === it.productId);
    return {
      productId: it.productId,
      name: p ? p.name : (it.name || 'منتج محذوف'),
      unit: p ? (p.unit || '') : (it.unit || ''),
      qty: Number(it.qty),
      price: Number(it.price)
    };
  });

  const i = state.invoices.findIndex(x => x.id === inv.id);
  if (i >= 0) state.invoices[i] = inv; else state.invoices.push(inv);

  persist();
  closeModal();
  renderCurrent();
  toast('تم حفظ الفاتورة ✅');
}

function deleteInvoice(id) {
  if (!confirm('حذف هذه الفاتورة نهائياً؟')) return;
  state.invoices = state.invoices.filter(x => x.id !== id);
  persist();
  closeModal();
  renderCurrent();
  toast('تم حذف الفاتورة');
}

/* ============================================================
   النافذة المنبثقة — فتح/إغلاق
============================================================ */
function showModal() { $('#modalBackdrop').classList.add('show'); }
function closeModal() {
  $('#modalBackdrop').classList.remove('show');
  $('#modalContent').innerHTML = '';
  editingProduct = null;
  editingInvoice = null;
}

/* ============================================================
   استيراد / تصدير
============================================================ */
function exportJSON() {
  const data = {
    app: 'baqala',
    version: 2,
    exportedAt: new Date().toISOString(),
    currency: state.currency,
    theme: state.theme,
    stores: state.stores,
    products: state.products,
    invoices: state.invoices
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `baqala-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('تم تنزيل ملف JSON 💾');
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!Array.isArray(d.products) && !Array.isArray(d.invoices)) throw new Error('bad');
      state.products = Array.isArray(d.products) ? d.products : [];
      state.invoices = Array.isArray(d.invoices) ? d.invoices : [];
      state.buyCart = {};

      if (Array.isArray(d.stores)) {
        state.stores = d.stores.map(normalizeStore).filter(Boolean);
      } else {
        const set = new Set();
        state.products.forEach(p => (p.prices || []).forEach(pr => {
          const s = normalizeStore(pr.store);
          if (s) set.add(s);
        }));
        state.invoices.forEach(i => {
          const s = normalizeStore(i.store);
          if (s) set.add(s);
        });
        state.stores = [...set].sort((a, b) => a.localeCompare(b, 'ar'));
      }

      if (d.currency) state.currency = d.currency;
      if (d.theme) { state.theme = d.theme; document.body.dataset.theme = d.theme; }
      $('#currencyInput').value = state.currency;
      buildSwatches();
      persist();
      renderCurrent();
      toast('تم استيراد البيانات ✅');
    } catch (e) {
      toast('ملف JSON غير صالح ❌', 'error');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   مستمعات الأحداث — النقر
============================================================ */
document.addEventListener('click', e => {
  if (!e.target.closest('#themePanel') && !e.target.closest('[data-act="theme-panel"]')) {
    $('#themePanel').classList.remove('show');
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  const idx = btn.dataset.idx;

  switch (act) {
    case 'nav': setPage(btn.dataset.page); break;
    case 'theme-panel': toggleThemePanel(); break;
    case 'theme': setTheme(btn.dataset.theme); break;
    case 'mode': toggleMode(); break;
    case 'import': $('#fileInput').click(); break;
    case 'export': exportJSON(); break;
    case 'demo': loadDemo(); break;

    /* إدارة المحلات */
    case 'manage-stores': openStoresModal(); break;
    case 'add-store': {
      const inp = $('#newStoreInput');
      const name = inp?.value || '';
      if (addStore(name)) {
        toast('تمت إضافة المحل ✅');
        renderStoresModal();
        setTimeout(() => $('#newStoreInput')?.focus(), 40);
        renderCurrent();
      } else {
        toast('اسم فارغ أو مكرر', 'error');
      }
      break;
    }
    case 'del-store': {
      const s = btn.dataset.store;
      const n = countProductsInStore(s);
      const msg = n > 0
        ? `حذف المحل "${s}" ؟\nسيتم حذف سعره من ${n} منتج (الفواتير القديمة لن تتأثر).`
        : `حذف المحل "${s}" ؟`;
      if (confirm(msg)) {
        removeStore(s);
        renderStoresModal();
        renderCurrent();
        toast('تم حذف المحل');
      }
      break;
    }

    /* المنتجات */
    case 'add-product': openProductModal(null); break;
    case 'edit-product': openProductModal(id); break;
    case 'del-product': deleteProduct(id); break;
    case 'save-product': saveProduct(); break;

    /* صورة المنتج */
    case 'pick-image': $('#imgInput')?.click(); break;
    case 'remove-image':
      if (editingProduct) { editingProduct.image = ''; refreshProductImagePreview(); }
      break;

    /* الشراء السريع */
    case 'buy-qty': {
      const pid = btn.dataset.id;
      const delta = Number(btn.dataset.delta) || 0;
      const cur = Number(state.buyCart[pid]) || 0;
      const next = Math.max(0, cur + delta);
      if (next > 0) state.buyCart[pid] = next; else delete state.buyCart[pid];
      persist();
      renderBuy();
      updateBuyBadge();
      break;
    }
    case 'buy-now': buyNow(btn.dataset.store); break;
    case 'clear-buy-cart':
      if (confirm('تفريغ السلة؟')) {
        state.buyCart = {};
        persist();
        renderBuy();
        updateBuyBadge();
      }
      break;

    /* الفواتير */
    case 'add-invoice': openInvoiceModal(null); break;
    case 'edit-invoice': openInvoiceModal(id); break;
    case 'del-invoice': deleteInvoice(id); break;
    case 'add-item':
      editingInvoice.items.push({ productId: '', name: '', unit: '', qty: 1, price: '' });
      renderItemRows();
      updateInvTotal();
      renderInvoiceComparison();
      break;
    case 'del-item':
      editingInvoice.items.splice(+idx, 1);
      if (!editingInvoice.items.length)
        editingInvoice.items.push({ productId: '', name: '', unit: '', qty: 1, price: '' });
      renderItemRows();
      updateInvTotal();
      renderInvoiceComparison();
      break;
    case 'save-invoice': saveInvoice(); break;
    case 'close-modal': closeModal(); break;
  }
});

/* ============================================================
   إدخالات النافذة
============================================================ */
$('#modalContent').addEventListener('input', onModalInput);
$('#modalContent').addEventListener('change', onModalInput);

function onModalInput(e) {
  const t = e.target;

  /* -------- نافذة المنتج -------- */
  if (editingProduct) {
    if (t.id === 'pName') { editingProduct.name = t.value; return; }
    if (t.id === 'pUnit') { editingProduct.unit = t.value; return; }

    if (t.id === 'imgInput') {
      const f = t.files && t.files[0];
      if (!f) return;
      resizeImage(f)
        .then(dataUrl => {
          editingProduct.image = dataUrl;
          refreshProductImagePreview();
          const actions = $('.img-actions');
          if (actions && !$('[data-act="remove-image"]')) {
            const b = document.createElement('button');
            b.className = 'btn ghost small';
            b.setAttribute('data-act', 'remove-image');
            b.style.cssText = 'justify-content:center;color:var(--bad)';
            b.textContent = '🗑 إزالة الصورة';
            actions.insertBefore(b, actions.lastElementChild);
          }
          toast('تم تحميل الصورة 📷');
        })
        .catch(() => toast('تعذر قراءة الصورة ❌', 'error'));
      return;
    }

    /* شطب/تحديد محل في نافذة المنتج */
    if (t.classList.contains('sp-check')) {
      const row = t.closest('.store-price-item');
      if (!row) return;
      const priceIn = $('.sp-price', row);
      if (t.checked) {
        row.classList.add('on');
        if (priceIn) { priceIn.disabled = false; priceIn.focus(); }
      } else {
        row.classList.remove('on');
        if (priceIn) { priceIn.disabled = true; priceIn.value = ''; }
      }
      return;
    }
    return;
  }

  /* -------- نافذة الفاتورة -------- */
  if (editingInvoice) {
    if (t.id === 'invDate') { editingInvoice.date = t.value; return; }
    if (t.id === 'invStore') {
      editingInvoice.store = t.value;
      fillPricesFromStore();
      renderItemRows();
      updateInvTotal();
      renderInvoiceComparison();
      return;
    }
    const row = t.closest('.item-row');
    if (row) {
      const i = +row.dataset.idx;
      const it = editingInvoice.items[i];
      if (!it) return;

      if (t.classList.contains('item-product')) {
        it.productId = t.value;
        const p = state.products.find(x => x.id === t.value);
        if (p) {
          it.name = p.name;
          it.unit = p.unit || '';
          const pr = priceFor(p, editingInvoice.store);
          if (pr != null) it.price = pr;
        }
        renderItemRows();
        updateInvTotal();
        renderInvoiceComparison();
        return;
      }
      if (t.classList.contains('item-qty')) { it.qty = t.value; updateSubtotals(); return; }
      if (t.classList.contains('item-price')) { it.price = t.value; updateSubtotals(); return; }
    }
  }
}

/* زر الإضافة داخل نافذة المحلات عند الضغط على Enter */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newStoreInput') {
    e.preventDefault();
    const name = e.target.value;
    if (addStore(name)) {
      toast('تمت إضافة المحل ✅');
      renderStoresModal();
      setTimeout(() => $('#newStoreInput')?.focus(), 40);
      renderCurrent();
    } else {
      toast('اسم فارغ أو مكرر', 'error');
    }
  }
});

/* ============================================================
   الإدخال العام (بحث + كمية السلة)
============================================================ */
document.addEventListener('input', e => {
  if (e.target.id === 'prodSearch') {
    state.productSearch = e.target.value;
    renderProducts();
    const el = $('#prodSearch');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }

  if (e.target.dataset.act === 'buy-qty-input') {
    const id = e.target.dataset.id;
    const v = Math.max(0, Math.floor(Number(e.target.value) || 0));
    if (v > 0) state.buyCart[id] = v; else delete state.buyCart[id];
    e.target.closest('.buy-card')?.classList.toggle('active', v > 0);
    updateBuyComparisonPanel();
    updateBuyBadge();
    persist();
  }
});

/* تغييرات عامة */
document.addEventListener('change', e => {
  if (e.target.id === 'invMonth') { state.invoiceMonth = e.target.value; renderInvoices(); }
  if (e.target.id === 'repMonth') { state.reportMonth = e.target.value; renderReports(); }
  if (e.target.id === 'currencyInput') {
    state.currency = e.target.value.trim() || 'ر.س';
    persist();
    renderCurrent();
  }
});

/* استيراد ملف JSON */
$('#fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) importJSON(f);
  e.target.value = '';
});

/* إغلاق النافذة */
$('#modalBackdrop').addEventListener('click', e => {
  if (e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); $('#themePanel').classList.remove('show'); }
});

/* ============================================================
   التشغيل
============================================================ */
(function init() {
  loadState();
  document.body.dataset.theme = state.theme;
  document.body.dataset.mode = state.mode;
  $('#currencyInput').value = state.currency;
  $('#modeBtn').title = state.mode === 'edit' ? 'التبديل لوضع القراءة' : 'التبديل لوضع التحرير';
  buildSwatches();
  setPage('products');
})();
</script>
