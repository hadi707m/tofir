document.addEventListener('click', e => {
  if (!e.target.closest('#themePanel') && !e.target.closest('[data-act="theme-panel"]')) {
    $('#themePanel').classList.remove('show');
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  const idx = btn.dataset.idx;
  const vi = btn.dataset.vi;

  switch (act) {
    case 'nav': setPage(btn.dataset.page); break;
    case 'theme-panel': toggleThemePanel(); break;
    case 'theme': setTheme(btn.dataset.theme); break;
    case 'mode': toggleMode(); closeSheet(); break;
    case 'import': $('#fileInput').click(); closeSheet(); break;
    case 'export': exportJSON(); break;
    case 'demo': loadDemo(); break;
    case 'mobile-more': openSheet(); break;

    case 'simulate-mobile':
      $('#mobileIframe').src = window.location.href;
      $('#iphoneOverlay').classList.add('show');
      break;
    case 'close-simulator':
      $('#iphoneOverlay').classList.remove('show');
      $('#mobileIframe').src = 'about:blank';
      loadState();
      renderCurrent();
      toast('تمت مزامنة التغييرات من محاكي الجوال');
      break;

    case 'toggle-bulk':
      state.showBulk = !state.showBulk;
      persist();
      renderProducts();
      toast(state.showBulk ? 'عرض الجملة ✅' : 'إخفاء الجملة');
      break;
    case 'toggle-diff':
      state.showDiff = !state.showDiff;
      persist();
      renderProducts();
      toast(state.showDiff ? 'عرض الفروقات ✅' : 'إخفاء الفروقات');
      break;

    case 'manage-stores': openStoresModal(); closeSheet(); break;
    case 'add-store': {
      const inp = $('#newStoreInput');
      const type = $('#newStoreType')?.value || 'unit';
      if (addStore(inp?.value, type)) {
        toast('تمت الإضافة ✅');
        renderStoresModal();
        setTimeout(() => $('#newStoreInput')?.focus(), 40);
      } else toast('اسم فارغ أو مكرر', 'error');
      break;
    }
    case 'toggle-store-active': {
      const s = state.stores.find(x => x.id === id);
      if (!s) break;
      s.active = s.active === false ? true : false;
      persist();
      renderStoresModal();
      renderCurrent();
      break;
    }
    case 'del-store': {
      const s = state.stores.find(x => x.id === id);
      if (!s) break;
      const n = countProductsInStore(s.name);
      const msg = n > 0 ? `حذف "${s.name}" ؟\nسيُحذف من ${n} منتج.` : `حذف "${s.name}" ؟`;
      if (confirm(msg)) {
        removeStore(id);
        renderStoresModal();
        renderCurrent();
      }
      break;
    }

    case 'add-product': openProductModal(null); break;
    case 'edit-product': openProductModal(id); break;
    case 'del-product': deleteProduct(id); break;
    case 'save-product': saveProduct(); break;
    case 'pick-image': $('#imgInput')?.click(); break;
    case 'remove-image':
      if (editingProduct) { editingProduct.image = ''; refreshProductImagePreview(); }
      break;
      
    case 'add-variant':
      if (editingProduct) { 
        syncVariantsFromDOM();
        editingProduct.variants.push(blankVariant()); 
        renderVariantsEditor(); 
      }
      break;
    case 'del-variant':
      if (editingProduct && editingProduct.variants.length > 1) {
        syncVariantsFromDOM();
        editingProduct.variants.splice(+vi, 1);
        renderVariantsEditor();
      }
      break;

    case 'select-suggestion': {
      const name = btn.dataset.name;
      const input = $('#pName');
      if (input) {
        input.value = name;
        editingProduct.name = name;
        $('#pNameSuggestions').classList.remove('show');
        const warn = $('#pNameWarning');
        if (warn) warn.style.display = 'block';
      }
      break;
    }

    case 'buy-qty': {
      const k = btn.dataset.key;
      const delta = Number(btn.dataset.delta) || 0;
      const cur = Number(state.buyCart[k]) || 0;
      const next = Math.max(0, cur + delta);
      if (next > 0) state.buyCart[k] = next; else delete state.buyCart[k];
      persist();
      renderBuy();
      updateBuyBadge();
      break;
    }
    case 'buy-now': buyNow(btn.dataset.store); break;
    case 'clear-buy-cart':
      if (confirm('تفريغ السلة؟')) {
        state.buyCart = {};
        persist(); renderBuy(); updateBuyBadge();
      }
      break;

    case 'add-invoice': openInvoiceModal(null); break;
    case 'edit-invoice': openInvoiceModal(id); break;
    case 'del-invoice': deleteInvoice(id); break;
    case 'add-item':
      editingInvoice.items.push({ productId: '', variantId: '', name: '', qty: 1, price: '' });
      renderItemRows(); updateInvTotal(); renderInvoiceComparison();
      break;
    case 'del-item':
      editingInvoice.items.splice(+idx, 1);
      if (!editingInvoice.items.length)
        editingInvoice.items.push({ productId: '', variantId: '', name: '', qty: 1, price: '' });
      renderItemRows(); updateInvTotal(); renderInvoiceComparison();
      break;
    case 'save-invoice': saveInvoice(); break;
    case 'close-modal': closeModal(); break;
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.suggestions-wrap')) {
    const suggBox = $('#pNameSuggestions');
    if (suggBox) suggBox.classList.remove('show');
  }
});

$('#sheetBackdrop').addEventListener('click', e => {
  if (e.target.id === 'sheetBackdrop') closeSheet();
});

$('#modalContent').addEventListener('input', onModalInput);
$('#modalContent').addEventListener('change', onModalInput);

function onModalInput(e) {
  const t = e.target;

  if (editingProduct) {
    if (t.id === 'pName') {
      editingProduct.name = t.value;
      
      const val = t.value.trim().toLowerCase();
      const suggBox = $('#pNameSuggestions');
      const warn = $('#pNameWarning');

      if (editingProduct._isNew) {
        const exists = state.products.some(p => p.name.trim().toLowerCase() === val);
        if (warn) {
          warn.style.display = (exists && val !== '') ? 'block' : 'none';
        }
      }

      if (editingProduct._isNew && val.length > 0 && suggBox) {
        const matches = state.products.filter(p => p.name.toLowerCase().includes(val));
        if (matches.length > 0) {
          suggBox.innerHTML = matches.map(p => `
            <div class="sugg-item" data-act="select-suggestion" data-name="${esc(p.name)}">
              <span>${esc(p.name)}</span>
              <span class="sugg-badge">موجود مسبقاً</span>
            </div>
          `).join('');
          suggBox.classList.add('show');
        } else {
          suggBox.classList.remove('show');
        }
      } else if (suggBox) {
        suggBox.classList.remove('show');
      }
      return;
    }

    if (t.id === 'imgInput') {
      const f = t.files && t.files[0];
      if (!f) return;
      resizeImage(f).then(dataUrl => {
        editingProduct.image = dataUrl;
        refreshProductImagePreview();
        const actions = $('.img-actions');
        if (actions && !$('[data-act="remove-image"]')) {
          const b = document.createElement('button');
          b.className = 'btn ghost small';
          b.setAttribute('data-act', 'remove-image');
          b.style.color = 'var(--bad)';
          b.textContent = '🗑 إزالة';
          actions.insertBefore(b, actions.lastElementChild);
        }
        toast('تم تحميل الصورة 📷');
      }).catch(() => toast('تعذر القراءة', 'error'));
      return;
    }

    const editor = t.closest('.variant-editor');
    if (editor) {
      const row = t.closest('.sp-row');
      if (row) {
        if (t.classList.contains('sp-check')) {
          const isBulk = row.dataset.bulk === '1';
          const priceIn = $('.sp-price', row);
          const countIn = $('.sp-count', row);
          if (t.checked) {
            row.classList.add('on');
            if (priceIn) { priceIn.disabled = false; priceIn.focus(); }
            if (countIn && isBulk) countIn.disabled = false;
          } else {
            row.classList.remove('on');
            if (priceIn) { priceIn.disabled = true; priceIn.value = ''; }
            if (countIn) { countIn.disabled = true; countIn.value = ''; }
            updateBulkRowComputed(row);
          }
          return;
        }
        if (t.classList.contains('sp-price') || t.classList.contains('sp-count')) {
          updateBulkRowComputed(row);
          return;
        }
      }
    }
    return;
  }

  if (editingInvoice) {
    if (t.id === 'invDate') { editingInvoice.date = t.value; return; }
    if (t.id === 'invStore') {
      editingInvoice.store = t.value;
      fillPricesFromStore();
      renderItemRows(); updateInvTotal(); renderInvoiceComparison();
      return;
    }
    const row = t.closest('.item-row');
    if (row) {
      const i = +row.dataset.idx;
      const it = editingInvoice.items[i];
      if (!it) return;
      if (t.classList.contains('item-product')) {
        const val = t.value;
        if (val) {
          const [pid, vid] = val.split('__');
          it.productId = pid; it.variantId = vid;
          const p = state.products.find(x => x.id === pid);
          const v = p ? getVariant(p, vid) : null;
          if (v) {
            const entry = variantPriceEntry(v, editingInvoice.store);
            if (entry) it.price = Number(entry.price);
          }
        } else { it.productId = ''; it.variantId = ''; }
        renderItemRows(); updateInvTotal(); renderInvoiceComparison();
        return;
      }
      if (t.classList.contains('item-qty')) { it.qty = t.value; updateSubtotals(); return; }
      if (t.classList.contains('item-price')) { it.price = t.value; updateSubtotals(); return; }
    }
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newStoreInput') {
    e.preventDefault();
    const type = $('#newStoreType')?.value || 'unit';
    if (addStore(e.target.value, type)) {
      toast('تمت الإضافة ✅');
      renderStoresModal();
      setTimeout(() => $('#newStoreInput')?.focus(), 40);
    } else toast('اسم فارغ أو مكرر', 'error');
  }
  if (e.key === 'Escape' && $('#iphoneOverlay').classList.contains('show')) {
    $('#iphoneOverlay').classList.remove('show');
    $('#mobileIframe').src = 'about:blank';
    loadState();
    renderCurrent();
    toast('تمت مزامنة التغييرات من محاكي الجوال');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'prodSearch') {
    state.productSearch = e.target.value;
    renderProducts();
    const el = $('#prodSearch');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }
  if (e.target.dataset.act === 'buy-qty-input') {
    const k = e.target.dataset.key;
    const v = Math.max(0, Math.floor(Number(e.target.value) || 0));
    if (v > 0) state.buyCart[k] = v; else delete state.buyCart[k];
    e.target.closest('.buy-card')?.classList.toggle('active', v > 0);
    updateBuyComparisonPanel();
    updateBuyBadge();
    persist();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'invMonth') { state.invoiceMonth = e.target.value; renderInvoices(); }
  if (e.target.id === 'repMonth') { state.reportMonth = e.target.value; renderReports(); }
  if (e.target.id === 'currencyInput') {
    state.currency = e.target.value.trim() || 'ر.س';
    persist(); renderCurrent();
  }
});

$('#fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) importJSON(f);
  e.target.value = '';
});

$('#modalBackdrop').addEventListener('click', e => {
  if (e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeSheet(); $('#themePanel').classList.remove('show'); }
});

(function init() {
  loadState();
  document.body.dataset.theme = state.theme;
  document.body.dataset.mode = state.mode;
  $('#currencyInput').value = state.currency;
  $('#modeBtn').title = state.mode === 'edit' ? 'التبديل لوضع القراءة' : 'التبديل لوضع التحرير';
  buildSwatches();
  setPage('products');
})();
</script>
</body>
</html>
